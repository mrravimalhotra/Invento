# Applies new files in supabase/migrations to the live Supabase database.
#
# - Pull request: dry run only, lists the migrations a merge would apply.
# - Push to main (or "Run workflow" by hand): applies them with `supabase db push`,
#   which runs each file not yet in supabase_migrations.schema_migrations, in order.
#
# Needs the repository secret SUPABASE_DB_URL: the Session pooler connection
# string (Supabase -> Connect -> Session pooler, port 5432) with the password filled in.
# See supabase/README.md.
name: Database migrations

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  pull_request:
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Forks never get the secret; only same-repository pull requests dry-run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Dry run (pending migrations)
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Apply
        if: github.event_name != 'pull_request'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
